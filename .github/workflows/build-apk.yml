name: Build Android Music Player APK

on:
  push:
    branches: [main, "rebrand/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name=android_music_player .
      - name: Set Android app label
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="android_music_player"/android:label="Android Music Player"/' "$MANIFEST"
          grep -q 'android:label="Android Music Player"' "$MANIFEST"
      - name: Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify release APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-music-player-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
