name: Build Android Music Player APK

on:
  push:
    branches: [main, "rebrand/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name=android_music_player .
      - name: Install native Android audio effects bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/android_music_player
          cat > android/app/src/main/kotlin/com/example/android_music_player/MainActivity.kt <<'KOTLIN'
          package com.example.android_music_player

          import android.media.audiofx.AudioEffect
          import android.media.audiofx.BassBoost
          import android.media.audiofx.Equalizer
          import android.media.audiofx.Virtualizer
          import android.media.audiofx.Visualizer
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.EventChannel
          import io.flutter.plugin.common.MethodChannel
          import kotlin.math.ln
          import kotlin.math.sqrt

          class MainActivity : FlutterActivity() {
            private val channelName = "android_music_player/audio_effects"
            private val visualizerChannelName = "android_music_player/visualizer"
            private var equalizer: Equalizer? = null
            private var bassBoost: BassBoost? = null
            private var virtualizer: Virtualizer? = null
            private var visualizer: Visualizer? = null
            @Volatile private var visualizerSink: EventChannel.EventSink? = null
            private var activeSession = 0
            private var visualizerSession = 0

            override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
              super.configureFlutterEngine(flutterEngine)
              EventChannel(flutterEngine.dartExecutor.binaryMessenger, visualizerChannelName)
                .setStreamHandler(object : EventChannel.StreamHandler {
                  override fun onListen(arguments: Any?, events: EventChannel.EventSink?) { visualizerSink = events }
                  override fun onCancel(arguments: Any?) { visualizerSink = null }
                })
              MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                .setMethodCallHandler { call, result ->
                  if (call.method == "startVisualizer") {
                    try {
                      val sessionId = call.argument<Int>("sessionId") ?: 0
                      if (sessionId <= 0) { result.success(false); return@setMethodCallHandler }
                      if (visualizer == null || visualizerSession != sessionId) {
                        releaseVisualizer()
                        val capture = Visualizer(sessionId)
                        capture.captureSize = Visualizer.getCaptureSizeRange()[1]
                        capture.setDataCaptureListener(object : Visualizer.OnDataCaptureListener {
                          override fun onWaveFormDataCapture(effect: Visualizer?, waveform: ByteArray?, samplingRate: Int) = Unit
                          override fun onFftDataCapture(effect: Visualizer?, fft: ByteArray?, samplingRate: Int) {
                            if (fft == null || fft.size < 4) return
                            val bins = 32
                            val positiveBins = (fft.size / 2).coerceAtLeast(1)
                            val levels = (0 until bins).map { index ->
                              val start = (1 + index * (positiveBins - 1) / bins).coerceIn(1, positiveBins)
                              val end = (1 + (index + 1) * (positiveBins - 1) / bins).coerceIn(start + 1, positiveBins + 1)
                              var peak = 0.0
                              for (bin in start until end) {
                                val offset = bin * 2
                                if (offset + 1 >= fft.size) break
                                val real = fft[offset].toInt().toDouble()
                                val imaginary = fft[offset + 1].toInt().toDouble()
                                peak = maxOf(peak, sqrt(real * real + imaginary * imaginary))
                              }
                              (ln(1.0 + peak) / ln(128.0)).coerceIn(0.0, 1.0)
                            }
                            runOnUiThread { visualizerSink?.success(levels) }
                          }
                        }, 20000, false, true)
                        capture.enabled = true
                        visualizer = capture
                        visualizerSession = sessionId
                      }
                      result.success(true)
                    } catch (error: Exception) {
                      releaseVisualizer()
                      result.error("VISUALIZER_FAILED", error.message ?: "Android visualizer could not start", null)
                    }
                    return@setMethodCallHandler
                  }
                  if (call.method != "configure") {
                    result.notImplemented()
                    return@setMethodCallHandler
                  }
                  try {
                    val sessionId = call.argument<Int>("sessionId") ?: 0
                    if (sessionId <= 0) {
                      result.success(false)
                      return@setMethodCallHandler
                    }
                    if (activeSession != sessionId) {
                      releaseEffects()
                      activeSession = sessionId
                      try { equalizer = Equalizer(0, sessionId) } catch (_: Exception) { equalizer = null }
                      try { bassBoost = BassBoost(0, sessionId) } catch (_: Exception) { bassBoost = null }
                      try { virtualizer = Virtualizer(0, sessionId) } catch (_: Exception) { virtualizer = null }
                    }

                    val eqOn = call.argument<Boolean>("equalizerEnabled") ?: true
                    val values = call.argument<List<Int>>("bands") ?: emptyList()
                    equalizer?.let { eq ->
                      eq.enabled = eqOn
                      val range = eq.bandLevelRange
                      val minLevel = range[0].toInt()
                      val maxLevel = range[1].toInt()
                      val numberOfBands = eq.numberOfBands.toInt()
                      for (band in 0 until numberOfBands) {
                        val targetFrequency = eq.getCenterFreq(band.toShort()).toDouble()
                        val uiIndex = when {
                          targetFrequency < 120 -> 0
                          targetFrequency < 400 -> 1
                          targetFrequency < 1500 -> 2
                          targetFrequency < 5000 -> 3
                          targetFrequency < 9000 -> 4
                          targetFrequency < 15000 -> 5
                          else -> 6
                        }
                        val db = values.getOrNull(uiIndex) ?: 0
                        val level = (db * 100).coerceIn(minLevel, maxLevel)
                        eq.setBandLevel(band.toShort(), level.toShort())
                      }
                    }

                    val bassOn = call.argument<Boolean>("bassEnabled") ?: false
                    val bassStrength = (call.argument<Int>("bassStrength") ?: 0).coerceIn(0, 1000)
                    bassBoost?.let { effect ->
                      effect.setStrength(bassStrength.toShort())
                      effect.enabled = bassOn
                    }

                    val surroundOn = call.argument<Boolean>("surroundEnabled") ?: false
                    val surroundStrength = (call.argument<Int>("surroundStrength") ?: 0).coerceIn(0, 1000)
                    virtualizer?.let { effect ->
                      effect.setStrength(surroundStrength.toShort())
                      effect.enabled = surroundOn
                    }
                    result.success(equalizer != null || bassBoost != null || virtualizer != null)
                  } catch (error: Exception) {
                    result.error("AUDIO_EFFECT_FAILED", error.message ?: "Android audio effects could not be applied", null)
                  }
                }
            }

            private fun releaseVisualizer() {
              try { visualizer?.setEnabled(false) } catch (_: Exception) {}
              try { visualizer?.release() } catch (_: Exception) {}
              visualizer = null
              visualizerSession = 0
            }

            private fun releaseEffects() {
              try { equalizer?.release() } catch (_: Exception) {}
              try { bassBoost?.release() } catch (_: Exception) {}
              try { virtualizer?.release() } catch (_: Exception) {}
              equalizer = null
              bassBoost = null
              virtualizer = null
            }

            override fun onDestroy() {
              releaseVisualizer()
              releaseEffects()
              super.onDestroy()
            }
          }
          KOTLIN
      - name: Set Android app label
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="android_music_player"/android:label="Android Music Player"/' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
          grep -q 'android:label="Android Music Player"' "$MANIFEST"
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"
      - name: Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify release APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-music-player-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
